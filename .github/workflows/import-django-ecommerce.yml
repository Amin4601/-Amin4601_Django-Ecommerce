name: Import Django Ecommerce

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Get importer workflow
        uses: actions/checkout@v4

      - name: Download upstream source archive
        run: |
          mkdir upstream
          curl -L --fail --retry 3 https://codeload.github.com/justdjango/django-ecommerce/tar.gz/refs/heads/master \
            | tar -xz --strip-components=1 -C upstream

      - name: Preserve importer and add attribution
        run: |
          mkdir -p upstream/.github/workflows
          cp .github/workflows/import-django-ecommerce.yml upstream/.github/workflows/import-django-ecommerce.yml
          cat >> upstream/README.md <<'EOF'

          ---

          ## Amin4601 portfolio mirror

          This repository contains an imported source snapshot of [Django Ecommerce](https://github.com/justdjango/django-ecommerce).
          The original project authors and the upstream GNU GPL v3.0 license are credited and preserved.
          This is an independently maintained portfolio mirror by Amin4601; it is not represented as the original work of Amin4601.
          EOF

      - name: Create clean Git history and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Django Ecommerce with upstream attribution"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c http.version=HTTP/1.1 push destination HEAD:main --force
